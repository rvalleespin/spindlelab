<!DOCTYPE html><html lang="es-CL"><head><meta charset="utf-8">
<title>Verifica y Cumple - Story para compartir</title>
<style>
  /* ------------------------------------------------------------------
     Story 1080x1920 de Verifica y Cumple.
     Sistema visual leido del CSS en produccion de verifica.spindlelab.cl
     (tokens verificados 25-sep-2026 contra el HTML servido).
     La sheriff no es decoracion: es la idea. Viene de tu lado, en caballo,
     con el papel en alto. Por eso el titular es el chiste del caballo y
     ella ocupa el centro entero de la pieza.
     NADA de SpindleLab aca: ni #0e141b, ni hilo de oro, ni Gabarito, ni Manrope.
     ------------------------------------------------------------------ */

  @font-face {
    font-family: "Archivo Black";
    font-style: normal; font-weight: 400; font-display: block;
    src: url("archivo-black-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Archivo Black";
    font-style: normal; font-weight: 400; font-display: block;
    src: url("archivo-black-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --azul-600:  #2e5bff;
    --lima-400:  #d6ff3d;
    --rosa-500:  #ff3ea0;
    --tinta-900: #17163a;
    --crema-100: #fffaf0;
    --blanco:    #ffffff;
    --display: "Archivo Black", Impact, sans-serif;
    --cuerpo: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body { background: var(--azul-600); }

  .story {
    position: relative; overflow: hidden;
    width: 1080px; height: 1920px;
    background: var(--azul-600);
  }

  /* El cielo del hero, mismo archivo del sitio. */
  .cielo {
    position: absolute; inset: 0; z-index: 0;
    background: url("hero-nubes.webp") center 46% / cover no-repeat;
    opacity: .60;
  }
  /* Velo azul: cierra arriba (donde va el titular) y abajo, y se abre al medio
     para que el cielo respire justo donde galopa el caballo. */
  .velo {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(14,32,118,.62) 0%,
      rgba(14,32,118,.52) 22%,
      rgba(14,32,118,.14) 44%,
      rgba(14,32,118,.12) 70%,
      rgba(14,32,118,.30) 100%);
  }

  /* ---- Zona alta de texto. Arranca en 262px: arriba vive la interfaz de IG. ---- */
  .texto { position: absolute; top: 262px; left: 0; right: 0; z-index: 4; text-align: center; padding: 0 50px; }

  .pill {
    display: inline-flex; align-items: center; gap: 13px;
    background: var(--lima-400); color: var(--tinta-900);
    font-family: var(--display); font-size: 25px;
    letter-spacing: .09em; text-transform: uppercase;
    padding: 12px 26px 10px; border-radius: 999px;
  }
  .pill svg { display: block; width: 27px; height: 27px; }

  /* Dos lineas de Archivo Black del mismo ancho optico, la segunda en lima.
     Es el gesto del titular del sitio. Los tamanos no son redondos: son el
     resultado de medir para que las dos lineas calcen borde a borde. */
  .titular {
    margin-top: 34px;
    font-family: var(--display); font-weight: 400;
    text-transform: uppercase; line-height: .95;
    letter-spacing: -.035em; white-space: nowrap;
  }
  .titular .l1 { display: block; font-size: 180px; color: var(--blanco); }
  .titular .l2 { display: block; font-size: 139px; color: var(--lima-400); margin-top: -4px; }

  /* ---- La sheriff. Mismo PNG del sitio, entero y sin retocar. Grande y
     sangrando por los costados: viene entrando al cuadro, no esta posando. ---- */
  .sheriff {
    position: absolute; z-index: 3;
    left: -6px; top: 690px;
    width: 1093px; height: auto; display: block;
    filter: drop-shadow(0 30px 40px rgba(8,18,74,.38));
  }

  /* ---- Banda de cierre. Termina EXACTO en 1670px: los ultimos 250px quedan
     libres para el sticker de enlace y el campo de respuesta de Instagram.
     Va por encima del caballo, asi los cascos aterrizan en ella. ---- */
  .banda {
    position: absolute; z-index: 5;
    left: 0; right: 0; top: 1452px; height: 218px;
    background: var(--lima-400);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .banda .linea {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--cuerpo); font-weight: 700;
    font-size: 31px; letter-spacing: .01em;
    color: rgba(23,22,58,.86);
  }
  .banda .linea svg { display: block; width: 26px; height: 26px; }
  .banda .url {
    font-family: var(--display); font-weight: 400;
    font-size: 68px; letter-spacing: -.03em;
    color: var(--tinta-900);
  }
</style>
</head>
<body>
<div class="story">

  <div class="cielo"></div>
  <div class="velo"></div>

  <div class="texto">
    <div class="pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6l2.9 6.36 6.95.77-5.18 4.68 1.43 6.84L12 16.76l-6.1 3.49 1.43-6.84L2.15 8.73l6.95-.77z"/></svg>
      Ley 21.719 &middot; Chequeo gratis
    </div>
    <p class="titular">
      <span class="l1">Lleg&oacute; la</span>
      <span class="l2">caballer&iacute;a</span>
    </p>
  </div>

  <img class="sheriff" src="hero-fiscalizador.png"
       alt="Una sheriff vestida de rosa cruza el cielo en un caballo rosado con un documento en alto.">

  <div class="banda">
    <div class="linea">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6l2.9 6.36 6.95.77-5.18 4.68 1.43 6.84L12 16.76l-6.1 3.49 1.43-6.84L2.15 8.73l6.95-.77z"/></svg>
      Revisamos gratis qu&eacute; te falta publicar
    </div>
    <div class="url">verifica.spindlelab.cl</div>
  </div>

</div>
</body></html>
