<!doctype html>
<meta charset="utf-8">
<title>Recuadro del sitio — overlay transparente</title>
<!--
  EL RECUADRO QUE MENCIONA EL SITIO, suelto y con fondo transparente, para montar
  sobre video en CapCut.

  El CSS es el del cierre del reel publicado (04-reel-estas-seguro/reel.html,
  clase .tarjeta), copiado tal cual para que el overlay y la pieza que ya salió
  sean la misma cosa. Si se toca acá, se toca allá.

  Sistema visual de VERIFICA: azul/lima/rosa + Archivo Black. Acá NO entra nada de
  SpindleLab (ni #0e141b, ni hilo de oro, ni Gabarito, ni Manrope).

  Dos encuadres, por ?modo=
    ?modo=cuadro  1080x1920, la tarjeta en su posición publicada (top 1252px).
                  Cae alineada con el reel sin tener que moverla.
    ?modo=justo   1080 de ancho y solo el alto de la tarjeta. Para posicionarla
                  libre en CapCut.

  El dominio va completo y escrito, nunca "link en la bio": en Instagram el enlace
  del pie no se puede tocar. Esa decisión viene del reel publicado.
-->
<style>
  @font-face {
    font-family: "Archivo Black"; font-style: normal; font-weight: 400; font-display: block;
    src: url("archivo-black-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
      U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Archivo Black"; font-style: normal; font-weight: 400; font-display: block;
    src: url("archivo-black-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
      U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
      U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  :root {
    --lima-400: #d6ff3d;
    --tinta-900: #17163a;
    --tinta-500: #56547a;
    --display: "Archivo Black", Impact, sans-serif;
    --cuerpo: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Ningún background acá: lo deja transparente --default-background-color=00000000.
     Si pones un background en html o body, el PNG sale opaco y tapa el video. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { position: relative; overflow: hidden; }
  body.cuadro { width: 1080px; height: 1920px; }
  body.justo  { width: 1080px; }

  /* --- copiado de reel.html, clase .tarjeta --- */
  .tarjeta {
    left: 50px; right: 50px;
    background: var(--lima-400);
    border-radius: 30px;
    padding: 34px 36px 40px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(10,20,80,.30);
  }
  body.cuadro .tarjeta { position: absolute; top: 1252px; }
  /* En el encuadre justo la sombra se dibuja hacia abajo, así que el margen de
     abajo tiene que dejarla entrar o sale cortada. */
  body.justo .tarjeta { position: relative; margin: 10px 50px 70px; left: 0; right: 0; }

  .tarjeta .rotulo {
    font-family: var(--cuerpo); font-size: 31px; font-weight: 800;
    letter-spacing: .13em; text-transform: uppercase; color: rgba(23,22,58,.74);
  }
  .tarjeta .dir {
    margin-top: 14px; font-family: var(--display); font-size: 70px;
    line-height: 1; letter-spacing: -.028em; color: var(--tinta-900);
  }
  .tarjeta .nota {
    margin-top: 16px; font-family: var(--cuerpo); font-size: 31px;
    font-weight: 600; color: var(--tinta-500);
  }
</style>

<div class="tarjeta">
  <div class="rotulo">Revisa el tuyo en</div>
  <div class="dir">verifica.spindlelab.cl</div>
  <div class="nota">Sin registro. No pedimos tu correo.</div>
</div>

<script>
  var modo = new URLSearchParams(location.search).get('modo') || 'cuadro';
  if (modo !== 'justo') modo = 'cuadro';
  document.body.className = modo;
  if (modo === 'justo') {
    // El alto lo fija la tarjeta más su margen: así el PNG sale sin franja
    // transparente de sobra y en CapCut se agarra por el borde real.
    var t = document.querySelector('.tarjeta');
    document.body.style.height = (t.offsetHeight + 80) + 'px';
  }
</script>
