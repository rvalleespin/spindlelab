<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'Gabarito'; src:url('Gabarito.woff2') format('woff2'); }
@font-face { font-family:'Manrope'; src:url('manrope.woff2') format('woff2'); font-weight:400 800; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1080px; overflow:hidden; font-family:'Manrope',sans-serif; background:transparent; }
.post { width:1080px; height:1080px; position:relative; padding:84px; display:flex; flex-direction:column; color:#f2efe8; }
.eyebrow { font-size:22px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#2fa99b;
  text-shadow:0 2px 14px rgba(14,20,27,.85); }
.centro { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:110px; }
.tit { font-family:'Gabarito'; font-weight:600; font-size:84px; line-height:1.1; letter-spacing:-2px;
  text-shadow:0 3px 22px rgba(14,20,27,.9); }
.sub { font-size:30px; line-height:1.5; color:#e4e9ee; max-width:880px; margin-top:26px;
  text-shadow:0 2px 16px rgba(14,20,27,.9); }
.foot { position:absolute; bottom:84px; left:84px; right:84px; display:flex; align-items:flex-end; justify-content:space-between;
  text-shadow:0 2px 14px rgba(14,20,27,.85); }
.wm { font-family:'Gabarito'; font-weight:600; font-size:42px; }
.cta { font-size:24px; color:#c8cfd6; }
</style></head><body>
<div class="post">
  <div class="eyebrow">Chequea tu sitio · Septiembre</div>
  <div class="centro">
    <div class="tit">Una ficha fallando<br>corta toda la venta.</div>
    <div class="sub">Web, redes, pauta: da lo mismo cuánto inviertas en el resto.</div>
  </div>
  <div class="foot">
    <div class="wm">SpindleLab<span style="color:#C9A227;">.</span></div>
    <div class="cta">Chequea tu sitio gratis · spindlelab.cl/diagnostico</div>
  </div>
</div>
</body></html>
