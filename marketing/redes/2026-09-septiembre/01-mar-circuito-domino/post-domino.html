<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* JUE 3-sep · concepto "el eje y el circuito" contado con DOMINO (idea de Ramon).
   La foto se ve NITIDA: el velo solo cae donde hay texto, no sobre las fichas.
   ENCUADRE (2-sep, nota de Ramon): reencuadrado a 30% 62%/140% para dejar FUERA la
   ficha del fondo derecho, que caia en direccion contraria y contradecia la inercia
   de la corrida. Era defecto de encuadre, no de imagen: se arregla moviendo el cuadro. */
.post.dm { padding:0; background:#05070a; }
.foto { position:absolute; inset:0; background:url('fondo-domino.png') 30% 62%/140% no-repeat, #05070a; }
.velo { position:absolute; inset:0; background:
  linear-gradient(180deg, rgba(5,7,10,0.90) 0%, rgba(5,7,10,0.72) 24%, rgba(5,7,10,0) 40%),
  linear-gradient(0deg, rgba(5,7,10,0.94) 0%, rgba(5,7,10,0.66) 14%, rgba(5,7,10,0) 26%); }
.capa { position:absolute; inset:0; padding:80px; display:flex; flex-direction:column; color:#f2efe8; }
.desde { display:flex; align-items:baseline; gap:12px; white-space:nowrap; }
.desde .svc { font-size:22px; color:#9aa4b0; }
.desde .val { font-family:'Gabarito'; font-weight:600; font-size:32px; color:#f2efe8; }
.desde .val i { font-style:normal; font-weight:400; font-size:20px; color:#9aa4b0; }
</style></head><body>
<div class="post dm">
  <div class="foto"></div>
  <div class="velo"></div>
  <div class="capa">
    <div class="eyebrow">Chequea tu sitio · Septiembre</div>
    <div class="rule"></div>
    <div class="h" style="font-size:70px; margin-top:34px; text-shadow:0 2px 24px rgba(5,7,10,.85);">Pagas para que lleguen.<br>El circuito se corta antes.</div>
    <div class="foot">
      <div>
        <div class="desde">
          <span class="svc">Visibilidad en IA</span>
          <span class="val"><i>desde</i> $400.000</span>
        </div>
        <div class="wm" style="margin-top:14px;">SpindleLab<span class="pt">.</span></div>
      </div>
      <div class="cta">Chequea tu sitio gratis · spindlelab.cl/diagnostico</div>
    </div>
  </div>
</div>
</body></html>
