<!doctype html><html lang="es-CL"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Gabarito'; src:url('Gabarito.woff2') format('woff2'); font-weight:400 700; font-display:block; }
  @font-face { font-family:'Inter'; src:url('inter.woff2') format('woff2'); font-weight:400 600; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; background:transparent; }
  body { position:relative; }
  .velo {
    position:absolute; top:0; left:0; right:0; height:820px;
    background:linear-gradient(180deg,
      rgba(8,11,15,.60) 0%,
      rgba(8,11,15,.42) 42%,
      rgba(8,11,15,.16) 74%,
      rgba(8,11,15,0) 100%);
    display:none;
  }
  .bloque {
    position:absolute; left:96px; width:888px; top:260px;
    font-family:'Gabarito', sans-serif; font-weight:700; color:#FFFFFF;
    font-size:96px; line-height:1.08; letter-spacing:-0.015em;
    text-shadow:0 3px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.65);
  }
  .pie {
    position:absolute; left:96px; width:888px; top:403px;
    font-family:'Inter', sans-serif; font-weight:400; font-size:42px;
    line-height:1.3; color:rgba(255,255,255,.92);
    text-shadow:0 3px 10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.7);
  }
  .oro { color:#C9A227; }
</style></head><body>
<div class="velo"></div>
<div class="bloque">Hay una ley nueva</div>
<div class="pie">Protección de datos personales</div>
</body></html>
