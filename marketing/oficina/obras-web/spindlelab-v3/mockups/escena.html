<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{background:var(--fondo);position:relative}
/* luz de estudio: más clara arriba al centro, cae hacia los bordes */
body::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 18%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.10));pointer-events:none}
.escena{position:absolute;inset:0}
/* laptop */
.lap{position:absolute;left:var(--lx);top:var(--ly);width:var(--lw)}
.lap .tapa{background:#0b0b0c;border-radius:calc(var(--lw)*.022) calc(var(--lw)*.022) calc(var(--lw)*.006) calc(var(--lw)*.006);padding:calc(var(--lw)*.017) calc(var(--lw)*.017) calc(var(--lw)*.022);box-shadow:inset 0 0 0 1.5px #3b3c3f, inset 0 0 0 3px #0b0b0c, 0 1px 0 rgba(255,255,255,.08);position:relative}
.lap .tapa::before{content:"";position:absolute;top:calc(var(--lw)*.0065);left:50%;width:calc(var(--lw)*.005);height:calc(var(--lw)*.005);margin-left:calc(var(--lw)*-.0025);border-radius:50%;background:#1d2128;box-shadow:0 0 0 1px #111}
.lap .pantalla{aspect-ratio:16/10;overflow:hidden;border-radius:2px;background:#000}
.lap .pantalla img{width:100%;display:block}
.lap .base{position:relative;margin:0 calc(var(--lw)*-.07);height:calc(var(--lw)*.024);background:linear-gradient(180deg,#e9eaec 0%,#c9cbcf 38%,#9fa2a7 100%);border-radius:0 0 calc(var(--lw)*.03) calc(var(--lw)*.03)/0 0 calc(var(--lw)*.016) calc(var(--lw)*.016);box-shadow:0 calc(var(--lw)*.03) calc(var(--lw)*.05) calc(var(--lw)*-.012) rgba(0,0,0,.45)}
.lap .base::before{content:"";position:absolute;left:50%;top:0;width:calc(var(--lw)*.14);margin-left:calc(var(--lw)*-.07);height:calc(var(--lw)*.009);background:linear-gradient(180deg,#a7aaaf,#c4c6ca);border-radius:0 0 calc(var(--lw)*.01) calc(var(--lw)*.01)}
.lap .base::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.7)}
.lap .suelo{position:absolute;left:-4%;right:-4%;bottom:calc(var(--lw)*-.045);height:calc(var(--lw)*.05);background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.30),rgba(0,0,0,0) 70%);filter:blur(6px);z-index:-1}
/* teléfono */
.tel{position:absolute;left:var(--tx);top:var(--ty);width:var(--tw);background:#121214;border-radius:calc(var(--tw)*.155);padding:calc(var(--tw)*.035);box-shadow:inset 0 0 0 2px #46474b,inset 0 0 0 4px #121214,0 calc(var(--tw)*.12) calc(var(--tw)*.22) calc(var(--tw)*-.04) rgba(0,0,0,.42),0 calc(var(--tw)*.02) calc(var(--tw)*.05) rgba(0,0,0,.25)}
.tel .pantalla{aspect-ratio:390/844;overflow:hidden;border-radius:calc(var(--tw)*.122);position:relative;background:#000}
.tel .pantalla img{width:100%;display:block}
.tel .barra{display:flex;justify-content:space-between;align-items:center;padding:0 calc(var(--tw)*.085) 0 calc(var(--tw)*.1);height:calc(var(--tw)*.115);background:var(--barra);color:var(--tinta);font:600 calc(var(--tw)*.04)/1 -apple-system,'Inter','Helvetica Neue',Arial,sans-serif;letter-spacing:-.01em}
.tel .bat{width:calc(var(--tw)*.062);height:calc(var(--tw)*.029);border:1.5px solid var(--tinta);border-radius:3px;opacity:.9;position:relative;padding:1.5px}.tel .bat i{display:block;height:100%;width:78%;background:var(--tinta);border-radius:1px}
.tel .suelo{position:absolute;left:8%;right:8%;bottom:calc(var(--tw)*-.07);height:calc(var(--tw)*.09);background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.32),rgba(0,0,0,0) 70%);filter:blur(5px);z-index:-1}
.tel .isla{position:absolute;top:calc(var(--tw)*.03);left:50%;width:calc(var(--tw)*.3);height:calc(var(--tw)*.085);margin-left:calc(var(--tw)*-.15);background:#000;border-radius:999px}
</style></head><body><div class="escena" id="e"></div>
<script>
const q=new URLSearchParams(location.search);const r=document.documentElement.style;
for(const k of ['w','h','fondo','lx','ly','lw','tx','ty','tw','barra','tinta'])if(q.get(k))r.setProperty('--'+k,q.get(k));
const e=document.getElementById('e');
if(q.get('esc'))e.insertAdjacentHTML('beforeend',`<div class="lap"><div class="tapa"><div class="pantalla"><img src="${q.get('esc')}"></div></div><div class="base"></div><div class="suelo"></div></div>`);
if(q.get('cel'))e.insertAdjacentHTML('beforeend',`<div class="tel">${q.get('suelo')?'<div class="suelo"></div>':''}<div class="pantalla"><div class="barra"><span>9:41</span><span class="bat"><i></i></span></div><img src="${q.get('cel')}"><div class="isla"></div></div></div>`);
</script></body></html>
