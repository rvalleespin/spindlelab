<!-- STORY-PORTADA · 1080×1920 (sirve también de portada de reel).
     Zonas (ver story-portada-guia): todo lo que se lee va entre y = 270 y y = 1250, que es la banda

.pieza img { object-position: 50% 62%; filter: saturate(0.65); }   /* como en post-foto: los puntos del dominó caían en el rango del oro */

.display { font-size: 130px; white-space: nowrap; }
.llamado { margin-top: 44px; }   /* termina en y ≈ 1170, lejos de la columna de íconos del reel (x > 850, y > 1150) */
</style></head><body class="f916">
<div class="banda">
