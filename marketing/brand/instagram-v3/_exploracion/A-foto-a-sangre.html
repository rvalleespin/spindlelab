<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- DIRECCIÓN A · «la foto manda». La imagen deja de ser una pieza con radio y pasa a ser el
     lienzo: ocupa la lámina entera. El texto se apoya ARRIBA, sobre el tercio que en domino.jpg
     es negro puro (0,0,0), así que NO hace falta velo ni gradiente: la legibilidad la da la foto.
     COSTO DECLARADO: contradice §07b («la foto va como pieza, con radio, en su proporción») y
     §10.6. Si se elige, esas dos reglas cambian PARA INSTAGRAM, y se escribe el porqué. -->
<style>
  body { padding: 0; }
  .fondo { position: absolute; inset: 0; }
  .fondo img { width: 100%; height: 100%; object-fit: cover; object-position: center 100%; display: block; }
  .capa { position: relative; height: 100%; padding: var(--d-m); display: flex; flex-direction: column; }
  .titular { margin-top: 44px; }
  .display { font-size: 120px; }
  .ojillo { margin-bottom: 24px; }
  .pie { margin-top: auto; }
  .llamado { font-size: var(--t-guia); line-height: 1.5; }
  .rot { margin-top: 6px; }
</style></head><body class="f45">
<div class="fondo"><img src="img/domino.jpg" alt=""></div>
<div class="capa">
  <div><span class="wm wm--76">SpindleLab<i>.</i></span></div>
  <div class="titular">
    <p class="ojillo">Estás pagando para que lleguen a tu sitio.</p>
    <h1 class="display">Ahí se corta<br>el circuito</h1>
  </div>
  <div class="pie">
    <p class="llamado">Comenta QUIERO MEJORAS<br>y te mandamos el chequeo por DM.</p>
    <p class="rot">SEO técnico y visibilidad en IA · Chile</p>
  </div>
</div>
</body></html>
