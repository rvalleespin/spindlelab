<!-- DIRECCIÓN B · «la evidencia es la imagen». Sin foto: lo que se muestra es el hallazgo real,
     en el mismo mono que el sitio usa dentro de las tarjetas. La marca vende «mostramos, no
     prometemos», y un fragmento de robots.txt dice más que una foto de escritorio.
     El fragmento es genérico e ilustrativo: no es de ningún prospecto. GPTBot es el rastreador
     real de OpenAI, y «Disallow: /» es la línea que lo bloquea entero. -->

  .llamado { font-size: var(--t-guia); line-height: 1.5; }
  .rot { margin-top: 6px; }
</style></head><body class="f45">
