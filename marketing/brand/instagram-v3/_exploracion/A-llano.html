<!-- DIRECCIÓN A · «la foto manda» · VARIANTE DE TITULAR LLANO (para pyme). La imagen deja de ser una pieza con radio y pasa a ser el
     lienzo: ocupa la lámina entera. El texto se apoya ARRIBA, sobre el tercio que en domino.jpg
     es negro puro (0,0,0), así que NO hace falta velo ni gradiente: la legibilidad la da la foto.
     ENCUADRE (7-oct, pedido de Ramón): la foto se alinea a la IZQUIERDA. En el original, al fondo
     a la derecha hay una ficha inclinada en sentido contrario al de la caída, y leída rápido
     parece que la fila se devuelve. Al recortar los 270 px sobrantes por la derecha, todas las
     fichas quedan cayendo hacia el mismo lado. Es la diferencia entre una fila que cae y un
     montón de fichas.
     POR QUÉ ESTE TITULAR Y NO «Ahí se corta el circuito»: Ramón pidió (7-oct) que se entienda
     para un dueño de pyme. «Circuito» es la metáfora interna de §06b y en el sitio funciona,
     porque quien llega ya está leyendo. En el feed el público es frío y «los pierdes» nombra el
     dolor sin pedir que se entienda una metáfora. EL TERRITORIO NO SE PIERDE: lo sostiene la foto
     del dominó, que es el molde declarado de §06b.
     COSTO DECLARADO: contradice §07b («la foto va como pieza, con radio, en su proporción») y
