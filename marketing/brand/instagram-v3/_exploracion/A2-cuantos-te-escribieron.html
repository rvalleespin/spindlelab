<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- DIRECCIÓN A · lámina 2 · «el número que te falta».
     ÁNGULO CYBER (Ramón, 7-oct): el CyberMonday fue del 5 al 7 de octubre y terminó anoche, así
     que el dueño tiene los números frescos HOY. Es la única semana del año en que esta pregunta
     llega en el momento exacto. VENTANA CORTA: pasada esta semana, el arranque se cambia por
     temporada alta (noviembre y diciembre) y el argumento se sostiene igual.
     IDEA DE RAMÓN (7-oct): darle al dueño de pyme una forma de juzgar lo que su agencia le entrega.
     CERO BENCHMARK INVENTADO: no se dice «lo normal es X %» porque no tenemos ese dato. El
     indicador es un número que él YA TIENE y puede contar hoy, sin pedirle permiso a nadie.
     Campo brasa (pilar Desarrollo, el servicio que resuelve esto). §10.5: en un carrusel, la
     portada va en negro con la foto y esta lleva el único campo. Da el ritmo foto → color. -->
<style>
  .ojillo { margin-bottom: 39px; }
  .display { line-height: 1.06; }   /* NO 0,9 (§10.4): con una vocal acentuada en MAYÚSCULAS, la
     tilde de la línea de abajo sube y choca con el espacio de la de arriba. En «AHORA ABRE / TU
     TELÉFONO», la tilde de la É se leía como una coma entre AHORA y ABRE. */
  .pregunta { margin-top: 39px; font-size: var(--t-h2); font-weight: 400; line-height: 1.4; max-width: 820px; }
  .cierre { margin-top: auto; border-top: var(--d-linea) solid color-mix(in srgb, currentColor 32%, transparent); padding-top: 50px; }
  .cierre b { font-size: var(--t-h3); font-weight: 600; line-height: 1.4; }
  .cierre .sub { margin-top: 28px; font-size: var(--t-desc); line-height: 1.5; opacity: .82; }
</style></head><body class="f45 campo--brasa">
<p class="ojillo rot" style="color:currentColor;opacity:.72">Ya tienes los números del Cyber: visitas, clics, alcance.</p>
<h2 class="display" style="font-size:96px;margin-bottom:0">Ahora abre<br>tu teléfono.</h2>
<p class="pregunta">¿Cuántos clientes nuevos te escribieron estos tres días?</p>
<div class="cierre">
  <p><b>Si no te escribió nadie, esas visitas no valieron nada.</b></p>
  <p class="sub">Pagaste para que llegaran a tu sitio, y se fueron. Eso no se arregla con más publicidad.</p>
</div>
</body></html>
