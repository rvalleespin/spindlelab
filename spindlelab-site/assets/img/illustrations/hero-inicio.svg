<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de una persona señalando una ventana de navegador donde una IA responde con una marca de verificación">
<!-- paleta fija (SVG externo no lee var()): ink #283338 · teal #1C5D5F · sage #65B8A2 · rose #D6AEC1 · seafoam #CAE1E2 · card-mint #E4F0F1 · line #DCE6E5 · paper #F2F8F7 -->

  <!-- sombra de piso -->
  <ellipse cx="95" cy="468" rx="72" ry="10" fill="#CAE1E2" opacity=".5"/>

  <!-- arcos de señal, esquina superior derecha de la ventana -->
  <path d="M515,27 A18,18 0 0 1 533,45" fill="none" stroke="#65B8A2" stroke-width="3" stroke-linecap="round" opacity=".65"/>
  <path d="M515,13 A32,32 0 0 1 547,45" fill="none" stroke="#65B8A2" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <path d="M515,-1 A46,46 0 0 1 561,45" fill="none" stroke="#65B8A2" stroke-width="3" stroke-linecap="round" opacity=".22"/>

  <!-- confeti disperso -->
  <circle cx="350" cy="26" r="4" fill="#D6AEC1"/>
  <circle cx="128" cy="55" r="3" fill="#65B8A2"/>
  <circle cx="447" cy="400" r="6" fill="none" stroke="#1C5D5F" stroke-width="2"/>

  <!-- persona: figura media, de pie, recortada por el borde inferior -->
  <path d="M60,232 Q97,214 132,232 L146,470 L44,470 Z" fill="#D6AEC1" stroke="#283338" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="93" cy="192" r="30" fill="#FFFFFF" stroke="#283338" stroke-width="3"/>
  <path d="M66,182 Q93,155 120,182" fill="none" stroke="#283338" stroke-width="3" stroke-linecap="round"/>
  <circle cx="84" cy="194" r="2.6" fill="#283338"/>
  <circle cx="102" cy="194" r="2.6" fill="#283338"/>
  <path d="M85,204 Q93,210 101,204" fill="none" stroke="#283338" stroke-width="2.5" stroke-linecap="round"/>

  <!-- brazo relajado -->
  <path d="M62,238 Q46,268 52,298" fill="none" stroke="#283338" stroke-width="26" stroke-linecap="round"/>
  <path d="M62,238 Q46,268 52,298" fill="none" stroke="#D6AEC1" stroke-width="20" stroke-linecap="round"/>
  <circle cx="52" cy="301" r="11" fill="#FFFFFF" stroke="#283338" stroke-width="2.5"/>

  <!-- brazo señalando la ventana -->
  <path d="M128,240 Q172,214 213,192" fill="none" stroke="#283338" stroke-width="26" stroke-linecap="round"/>
  <path d="M128,240 Q172,214 213,192" fill="none" stroke="#D6AEC1" stroke-width="20" stroke-linecap="round"/>
  <circle cx="213" cy="192" r="12" fill="#FFFFFF" stroke="#283338" stroke-width="2.5"/>
  <path d="M222,184 L238,172" fill="none" stroke="#283338" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ventana del navegador -->
  <rect x="150" y="50" width="360" height="250" rx="16" fill="#FFFFFF" stroke="#283338" stroke-width="3"/>
  <line x1="150" y1="92" x2="510" y2="92" stroke="#283338" stroke-width="3"/>
  <circle cx="172" cy="71" r="5" fill="#CAE1E2" stroke="#65B8A2" stroke-width="1.5"/>
  <circle cx="192" cy="71" r="5" fill="#CAE1E2" stroke="#65B8A2" stroke-width="1.5"/>
  <circle cx="212" cy="71" r="5" fill="#CAE1E2" stroke="#65B8A2" stroke-width="1.5"/>

  <!-- burbuja de respuesta con estrella de señal -->
  <path d="M183,118 h292 a18,18 0 0 1 18,18 v56 a18,18 0 0 1 -18,18 h-235 l-28,22 v-22 h-29 a18,18 0 0 1 -18,-18 v-56 a18,18 0 0 1 18,-18 z" fill="#E4F0F1" stroke="#283338" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M228,138 Q231,152 246,155 Q231,158 228,172 Q225,158 210,155 Q225,152 228,138 Z" fill="#1C5D5F"/>
  <rect x="262" y="147" width="110" height="8" rx="4" fill="#DCE6E5"/>
  <rect x="262" y="163" width="80" height="8" rx="4" fill="#DCE6E5"/>

  <!-- líneas de una segunda respuesta, más abajo en la ventana -->
  <rect x="185" y="238" width="190" height="8" rx="4" fill="#DCE6E5"/>
  <rect x="185" y="254" width="130" height="8" rx="4" fill="#DCE6E5"/>
  <rect x="185" y="270" width="150" height="8" rx="4" fill="#DCE6E5"/>

  <!-- lupa flotante -->
  <circle cx="495" cy="330" r="28" fill="#F2F8F7" fill-opacity=".9" stroke="#1C5D5F" stroke-width="4"/>
  <line x1="515" y1="350" x2="535" y2="372" stroke="#1C5D5F" stroke-width="8" stroke-linecap="round"/>
  <path d="M483,320 Q487,312 496,310" fill="none" stroke="#65B8A2" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
